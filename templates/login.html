{% extends "base.html" %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">Data Analytics Platform</h1>
        <h2 class="login-subtitle">Sign In</h2>
        <form data-testid="login-form" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" data-testid="username-input"
                       class="form-control" placeholder="Enter username" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" data-testid="password-input"
                       class="form-control" placeholder="Enter password" autocomplete="current-password">
            </div>
            {% if error %}
            <div data-testid="error-message" class="error">{{ error }}</div>
            {% endif %}
            <button type="submit" data-testid="login-button" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>
</div>
{% endblock %}
