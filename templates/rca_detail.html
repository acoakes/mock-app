{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>RCA Detail</h1>
    <a href="/rca" class="btn btn-secondary">← Back to RCA</a>
</div>

<div data-testid="rca-detail-panel" class="detail-panel">
    <div class="detail-row">
        <span class="detail-label">ID</span>
        <span class="detail-value">{{ rca.id }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Title</span>
        <span class="detail-value">{{ rca.title }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value">{{ rca.status }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Root Cause</span>
        <p data-testid="root-cause-description" class="detail-value">{{ rca.root_cause }}</p>
    </div>
    <div class="detail-row">
        <span class="detail-label">Recommendation</span>
        <p data-testid="recommendation-text" class="detail-value">{{ rca.recommendation }}</p>
    </div>

    {% if success %}
    <div data-testid="success-message" class="success">Status updated successfully</div>
    {% endif %}

    <div class="detail-actions">
        <h3>Update Status</h3>
        <form method="post" action="/rca/{{ rca.id }}/update" class="filter-form">
            <div class="form-group form-inline">
                <label for="status">Status</label>
                <select id="status" name="status" data-testid="status-update-select" class="form-control">
                    <option value="open" {% if rca.status == 'open' %}selected{% endif %}>open</option>
                    <option value="in_progress" {% if rca.status == 'in_progress' %}selected{% endif %}>in_progress</option>
                    <option value="resolved" {% if rca.status == 'resolved' %}selected{% endif %}>resolved</option>
                </select>
            </div>
            <button type="submit" data-testid="save-status-button" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
