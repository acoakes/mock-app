{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Anomaly Detail</h1>
    <a href="/anomalies" class="btn btn-secondary">← Back to Anomalies</a>
</div>

<div data-testid="anomaly-detail-panel" class="detail-panel">
    <div class="detail-row">
        <span class="detail-label">ID</span>
        <span class="detail-value">{{ anomaly.id }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Description</span>
        <p data-testid="anomaly-description" class="detail-value">{{ anomaly.description }}</p>
    </div>
    <div class="detail-row">
        <span class="detail-label">Severity</span>
        <span class="detail-value severity-{{ anomaly.severity | lower }}">{{ anomaly.severity }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value">{{ anomaly.status }}</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Timestamp</span>
        <span class="detail-value">{{ anomaly.timestamp }}</span>
    </div>

    <div class="detail-actions">
        <form method="post" action="/anomalies/{{ anomaly.id }}/acknowledge">
            <button data-testid="acknowledge-button" type="submit" class="btn btn-primary">Acknowledge</button>
        </form>
    </div>
</div>
{% endblock %}
