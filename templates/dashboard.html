{% extends "base.html" %}
{% block content %}
<h1>KPI Dashboard</h1>

<div class="kpi-grid">
    {% for kpi in kpis %}
    <div class="kpi-card" data-testid="kpi-card">
        <div data-testid="kpi-name" class="kpi-name">{{ kpi.name }}</div>
        <div data-testid="kpi-value" class="kpi-value">{{ kpi.value }}{% if kpi.unit %}<span class="kpi-unit">{{ kpi.unit }}</span>{% endif %}</div>
    </div>
    {% endfor %}
</div>

<div data-testid="dashboard-chart" class="chart-placeholder">Chart Placeholder</div>

<div class="filter-section">
    <h2>Date Filter</h2>
    <form data-testid="date-filter-form" method="get" class="filter-form">
        <div class="form-group form-inline">
            <label for="date_from">From</label>
            <input type="date" id="date_from" name="date_from" data-testid="date-from"
                   class="form-control" value="{{ date_from }}">
        </div>
        <div class="form-group form-inline">
            <label for="date_to">To</label>
            <input type="date" id="date_to" name="date_to" data-testid="date-to"
                   class="form-control" value="{{ date_to }}">
        </div>
        <button type="submit" data-testid="apply-filter" class="btn btn-primary">Apply</button>
    </form>
</div>

{% if empty_state %}
<div data-testid="empty-state" class="empty-state">No data available for selected range</div>
{% endif %}
{% endblock %}
