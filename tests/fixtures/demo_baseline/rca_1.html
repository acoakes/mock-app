<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analytics Platform</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <span class="nav-brand">Analytics Platform</span>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/anomalies" class="nav-link">Anomalies</a>
                <a href="/rca" class="nav-link">RCA</a>
                <a href="/logout" class="nav-link nav-link-logout">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        
<div class="page-header">
    <h1>RCA Detail</h1>
    <a href="/rca" class="btn btn-secondary">← Back to RCA</a>
</div>

<div data-testid="rca-detail-panel" class="detail-panel">
    <div class="detail-row">
        <span class="detail-label">ID</span>
        <span class="detail-value">1</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Title</span>
        <span class="detail-value">Null Value Spike Root Cause</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value">resolved</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">Root Cause</span>
        <p data-testid="root-cause-description" class="detail-value">Upstream data pipeline failed validation step</p>
    </div>
    <div class="detail-row">
        <span class="detail-label">Recommendation</span>
        <p data-testid="recommendation-text" class="detail-value">Add validation checkpoint at ingestion layer</p>
    </div>

    

    <div class="detail-actions">
        <h3>Update Status</h3>
        <form method="post" action="/rca/1/update" class="filter-form">
            <div class="form-group form-inline">
                <label for="status">Status</label>
                <select id="status" name="status" data-testid="status-update-select" class="form-control">
                    <option value="open" >open</option>
                    <option value="in_progress" >in_progress</option>
                    <option value="resolved" selected>resolved</option>
                </select>
            </div>
            <button type="submit" data-testid="save-status-button" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

    </div>
</body>
</html>
